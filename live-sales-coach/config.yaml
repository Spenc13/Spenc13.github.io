# Live Sales Coach configuration.
# API keys are NOT stored here. Put them in a .env file (see .env.example)
# or set DEEPGRAM_API_KEY and ANTHROPIC_API_KEY in your environment.

rep_name: Spencer Faircloth
rep_title: Sales Rep

window:
  stay_on_top: true          # keep the window above Meet / your dialer (toggle in View menu)
  width: 1440
  height: 960

audio:
  # Run `python main.py --list-devices` to see names and indexes.
  # A device can be an index (number) or part of its name (text, case-insensitive).
  # Leave blank to use the system default.
  mic_device: ""             # Spencer's microphone or headset
  # Prospect audio:
  #   Windows: leave blank to use WASAPI loopback of your default speakers/headset,
  #            or name the output device whose audio you want to capture.
  #   macOS:   set to "BlackHole 2ch" (see README, "macOS audio routing").
  loopback_device: ""
  backend: auto              # auto | wasapi (Windows, PyAudioWPatch) | sounddevice
  chunk_ms: 100              # size of each audio chunk sent to STT
  # If your own voice also shows up in the call audio (headset sidetone, Windows
  # "Listen to this device", or echo from the prospect's phone), drop those
  # repeats instead of labeling them Prospect.
  echo_filter: true
  # Windows: listen to every speaker and follow the one playing the other person
  # (Bluetooth "Hands-Free" switching, Meet/dialer speaker settings). Ignored if
  # loopback_device is set. Pick a speaker by hand in the transcript header.
  follow_call_audio: true
  echo_hold_ms: 700          # how long to wait for your own line before deciding

stt:
  provider: deepgram         # deepgram (live). Replay text mode bypasses STT.
  model: nova-3
  language: en-US
  endpointing_ms: 300        # silence before Deepgram finalizes a phrase
  utterance_end_ms: 1000
  keyterms:                  # words Deepgram should favor (nova-3 keyterm prompting)
    - Olly Olly
    - Google Business Profile
    - NAP
    - retargeting
    - Map Pack
    - LSA

coach:
  model: claude-sonnet-5-5   # current Sonnet. Any Messages API model id works.
  # Thinking: "adaptive" (model decides; keep effort low for speed) or
  # "between_tools" (Sonnet 5.5 only: no extended thinking, lowest latency).
  thinking: adaptive
  effort: low                # low | medium | high
  max_tokens: 2000           # includes any thinking tokens; replies are ~80 words
  server_fallback: true      # retry declined requests on a fallback model (server-side)
  # Live coach ("parrot" mode): a fresh line to read out loud after every prospect
  # turn, not only on objections. Toggle it in the app header too.
  live_mode: true
  live_thinking: between_tools   # fastest: no extended thinking (Sonnet 5.5). Or "adaptive".
  transcript_window_minutes: 4   # last N minutes of transcript sent with each request
  summary_refresh_seconds: 90    # how often the running summary absorbs older lines
  post_call_max_tokens: 8000

live_coach:
  min_prospect_words: 3      # skip "yeah", "mm-hmm" (unless it's a question or an objection)
  min_gap_seconds: 2         # at most one new line every 2 seconds
  turn_end_wait_ms: 900      # if speech-to-text doesn't mark the end of a turn, wait this long

triggers:
  auto: true
  min_gap_seconds: 8         # never auto-fire more often than this
  same_kind_cooldown_seconds: 45   # don't repeat the same objection type within this window

hotkey:
  windows: "<ctrl>+<shift>+<space>"
  mac: "<cmd>+<shift>+<space>"
  global: true               # works while Meet or your dialer has focus (needs pynput)
  lookback_seconds: 20       # "the last few seconds" the hotkey asks about

replay:
  speed: 1.0                 # 2.0 plays a sample script twice as fast
  words_per_minute: 165      # speaking rate used to time text-script lines

storage:
  calls_dir: calls

recording:
  # "ask": confirm the recording notice before every recording.
  # "dialer": your dialer already announces recording on every call, so coaching
  #           starts immediately (and automatically when a dialer call is answered).
  # You can also switch this in the app: Call menu → Ask before each recording.
  consent_mode: ask
  # Google Meet doesn't announce recording, so Meets show the notice even in
  # "dialer" mode. Set to "announced" only if your Meets are recorded by Meet
  # itself (Meet tells everyone when recording or note-taking starts).
  meet_consent_mode: ask

call_filter:
  # Calls that go nowhere (no answer, quick hang-up, voicemail) are not saved
  # or graded. You can still keep one with "Save anyway" right after it ends.
  min_seconds: 45            # shorter calls are discarded
  min_prospect_words: 25     # the prospect must say at least this much
  discard_voicemail: true    # discard calls that hit a voicemail greeting

phone_bridge:
  # Link to the "Olly Coach Bridge" Chrome extension (extension/ folder).
  # When a HubSpot/Aloware call is answered, the coach pops up ready to start;
  # when the call ends, coaching ends. Listens on this computer only.
  enabled: true
  port: 8765                 # if you change this, change it in extension/background.js too
